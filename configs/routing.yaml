default_mode: "cloud"

rules:
  novel_complex_task: "cloud"
  privacy_sensitive_task: "hybrid"
  high_similarity_task: "local"
  cloud_unavailable: "local"
  quality_gated_task: "hybrid"
  action_task_when_ready: "local"
  action_task_when_unready: "hybrid"

thresholds:
  similarity_for_local: 0.85
  local_quality_for_local: 0.7
  codex_action_readiness_for_local: 0.6
  continue_action_readiness_for_local: 0.62
  patch_action_readiness_for_local: 0.68
  log_action_readiness_for_local: 0.58
  budget_warning: 0.8
